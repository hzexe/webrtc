name: Build WebRTC for Android

on:
  workflow_dispatch:
    inputs:
      webrtc_branch:
        description: 'WebRTC 分支 (例如: branch-heads/7605)'
        required: false
        default: 'branch-heads/7605'
        type: string
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DEPOT_TOOLS_VERSION: 'main'
  WEBRTC_BRANCH: ${{ github.event.inputs.webrtc_branch || 'branch-heads/7605' }}

jobs:
  build-webrtc:
    name: Build WebRTC Android
    runs-on: self-hosted
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 设置环境变量
        run: |
          echo "WEBRTC_BRANCH=${{ env.WEBRTC_BRANCH }}" >> $GITHUB_ENV
          echo "WEBRTC_SRC_DIR=${{ github.workspace }}" >> $GITHUB_ENV
          echo "OUTPUT_DIR=${{ github.workspace }}/output" >> $GITHUB_ENV
          
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            unzip \
            python3 \
            python3-pip \
            build-essential \
            openjdk-11-jdk
          
      - name: 安装 depot_tools
        run: |
          cd $HOME
          
          # 检查 depot_tools 目录是否存在
          if [ -d "depot_tools" ]; then
            echo "depot_tools 目录已存在，跳过下载"
          else
            echo "正在下载 depot_tools..."
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
            echo "depot_tools 下载完成"
          fi
          
          # 添加到 PATH（无论目录是否已存在）
          echo "$HOME/depot_tools" >> $GITHUB_PATH
          echo "已将 depot_tools 添加到 PATH"
          
      - name: 配置 Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
      - name: 同步 WebRTC 源码
        run: |
          echo "开始同步 WebRTC 源码 (分支: ${{ env.WEBRTC_BRANCH }})..."
          mkdir -p ${{ env.WEBRTC_SRC_DIR }}
          cd ${{ env.WEBRTC_SRC_DIR }}
          
          # 初始化 depot_tools
          fetch --nohooks webrtc_android
          
          # 切换到指定分支
          cd src
          git fetch origin
          
          # 尝试检出分支（按优先级尝试不同的分支格式）
          # 1. 尝试里程碑分支格式：branch-heads/7605
          git checkout -b ${{ env.WEBRTC_BRANCH }} origin/branch-heads/${{ env.WEBRTC_BRANCH }} 2>/dev/null || \
          # 2. 尝试 origin 前缀格式：origin/main
          git checkout -b ${{ env.WEBRTC_BRANCH }} origin/${{ env.WEBRTC_BRANCH }} 2>/dev/null || \
          # 3. 尝试本地分支
          git checkout ${{ env.WEBRTC_BRANCH }}
          
          # 运行 hooks
          gclient sync
          
      - name: 编译 arm64-v8a 架构
        run: |
          echo "开始编译 arm64-v8a 架构..."
          cd ${{ env.WEBRTC_SRC_DIR }}/src
          
          # 生成构建配置
          # 注意：以下参数确保包含 AEC、NS、VAD 等音频处理功能
          # 仅排除测试、示例代码、视频编解码器和 P2P 网络功能，保留核心音频功能
          # 添加优化参数以减少编译产物大小和磁盘使用
          # 禁用 Android 静态分析以避免 AUTONINJA_BUILD_ID 错误
          gn gen out/android_arm64 --args="target_os=\"android\" target_cpu=\"arm64\" is_debug=false is_component_build=false rtc_include_tests=false rtc_build_examples=false rtc_enable_protobuf=true use_custom_libcxx=true treat_warnings_as_errors=false rtc_enable_android_opensl=true rtc_enable_android_aaudio=true rtc_enable_libaom=false rtc_enable_libvpx=false rtc_enable_h264=false rtc_enable_vp8=false rtc_enable_vp9=false rtc_enable_av1=false rtc_enable_bwe_test_logging=false rtc_enable_event_tracing=false rtc_enable_peerconnection=false rtc_enable_datachannel=false rtc_enable_sctp=false rtc_include_builtin_audio_codecs=true use_rtti=false use_exceptions=false symbol_level=0 enable_pgo=false enable_remoting=false enable_widevine=false android_static_analysis=false"
          
          # 列出所有可用的 GN 参数（用于后续优化）
          echo "列出所有可用的 GN 参数..."
          gn args --list out/android_arm64 > ${{ env.OUTPUT_DIR }}/gn_args_arm64.txt
          echo "GN 参数列表已保存到: ${{ env.OUTPUT_DIR }}/gn_args_arm64.txt"
          
          # 编译
          ninja -C out/android_arm64 libwebrtc
          
      - name: 清理磁盘空间
        run: |
          echo "清理磁盘空间..."
          # 清理 apt 缓存
          sudo apt-get clean
          sudo apt-get autoremove -y
          
          # 清理不必要的文件
          rm -rf ~/.cache
          rm -rf ~/.npm
          
          # 显示磁盘使用情况
          df -h
          
      - name: 编译 x86_64 架构
        run: |
          echo "开始编译 x86_64 架构..."
          cd ${{ env.WEBRTC_SRC_DIR }}/src
          
          # 生成构建配置
          # 注意：以下参数确保包含 AEC、NS、VAD 等音频处理功能
          # 仅排除测试、示例代码、视频编解码器和 P2P 网络功能，保留核心音频功能
          # 禁用 Android 静态分析以避免 AUTONINJA_BUILD_ID 错误
          gn gen out/android_x64 --args="target_os=\"android\" target_cpu=\"x64\" is_debug=false is_component_build=false rtc_include_tests=false rtc_build_examples=false rtc_enable_protobuf=true use_custom_libcxx=true treat_warnings_as_errors=false rtc_enable_android_opensl=true rtc_enable_android_aaudio=true rtc_enable_libaom=false rtc_enable_libvpx=false rtc_enable_h264=false rtc_enable_vp8=false rtc_enable_vp9=false rtc_enable_av1=false rtc_enable_bwe_test_logging=false rtc_enable_event_tracing=false rtc_enable_peerconnection=false rtc_enable_datachannel=false rtc_enable_sctp=false rtc_include_builtin_audio_codecs=true use_rtti=false use_exceptions=false symbol_level=0 enable_pgo=false enable_remoting=false enable_widevine=false android_static_analysis=false"
          
          # 列出所有可用的 GN 参数（用于后续优化）
          echo "列出所有可用的 GN 参数..."
          gn args --list out/android_x64 > ${{ env.OUTPUT_DIR }}/gn_args_x64.txt
          echo "GN 参数列表已保存到: ${{ env.OUTPUT_DIR }}/gn_args_x64.txt"
          
          # 编译
          ninja -C out/android_x64 libwebrtc
          
      - name: 收集编译产物
        run: |
          echo "收集编译产物..."
          mkdir -p ${{ env.OUTPUT_DIR }}/{arm64,x64,universal}
          
          # 复制 arm64 AAR
          if [ -f "${{ env.WEBRTC_SRC_DIR }}/src/out/android_arm64/lib.java/sdk/android/libwebrtc/libwebrtc.aar" ]; then
            cp "${{ env.WEBRTC_SRC_DIR }}/src/out/android_arm64/lib.java/sdk/android/libwebrtc/libwebrtc.aar" \
               "${{ env.OUTPUT_DIR }}/arm64/libwebrtc_arm64.aar"
          fi
          
          # 复制 x64 AAR
          if [ -f "${{ env.WEBRTC_SRC_DIR }}/src/out/android_x64/lib.java/sdk/android/libwebrtc/libwebrtc.aar" ]; then
            cp "${{ env.WEBRTC_SRC_DIR }}/src/out/android_x64/lib.java/sdk/android/libwebrtc/libwebrtc.aar" \
               "${{ env.OUTPUT_DIR }}/x64/libwebrtc_x64.aar"
          fi
          
          # 复制 arm64 静态库
          if [ -f "${{ env.WEBRTC_SRC_DIR }}/src/out/android_arm64/obj/libwebrtc.a" ]; then
            cp "${{ env.WEBRTC_SRC_DIR }}/src/out/android_arm64/obj/libwebrtc.a" \
               "${{ env.OUTPUT_DIR }}/arm64/libwebrtc_arm64.a"
          fi
          
          # 复制 x64 静态库
          if [ -f "${{ env.WEBRTC_SRC_DIR }}/src/out/android_x64/obj/libwebrtc.a" ]; then
            cp "${{ env.WEBRTC_SRC_DIR }}/src/out/android_x64/obj/libwebrtc.a" \
               "${{ env.OUTPUT_DIR }}/x64/libwebrtc_x64.a"
          fi
          
          # 创建通用 AAR (合并多架构)
          echo "创建通用 AAR..."
          TEMP_DIR=$(mktemp -d)
          
          # 解压 arm64 AAR
          if [ -f "${{ env.OUTPUT_DIR }}/arm64/libwebrtc_arm64.aar" ]; then
            mkdir -p $TEMP_DIR/arm64
            cd $TEMP_DIR/arm64
            unzip -q "${{ env.OUTPUT_DIR }}/arm64/libwebrtc_arm64.aar"
            cd -
          fi
          
          # 解压 x64 AAR
          if [ -f "${{ env.OUTPUT_DIR }}/x64/libwebrtc_x64.aar" ]; then
            mkdir -p $TEMP_DIR/x64
            cd $TEMP_DIR/x64
            unzip -q "${{ env.OUTPUT_DIR }}/x64/libwebrtc_x64.aar"
            cd -
          fi
          
          # 合并 JNI 库
          mkdir -p $TEMP_DIR/universal/jni
          if [ -d "$TEMP_DIR/arm64/jni" ]; then
            cp -r $TEMP_DIR/arm64/jni/* $TEMP_DIR/universal/jni/
          fi
          if [ -d "$TEMP_DIR/x64/jni" ]; then
            cp -r $TEMP_DIR/x64/jni/* $TEMP_DIR/universal/jni/
          fi
          
          # 复制其他必要文件
          if [ -d "$TEMP_DIR/arm64" ]; then
            find $TEMP_DIR/arm64 -maxdepth 1 -type f -exec cp {} $TEMP_DIR/universal/ \;
          fi
          
          # 打包通用 AAR
          cd $TEMP_DIR/universal
          zip -q -r "${{ env.OUTPUT_DIR }}/universal/libwebrtc_universal.aar" *
          cd -
          
          rm -rf $TEMP_DIR
          
          # 列出输出文件
          echo "编译产物列表:"
          find ${{ env.OUTPUT_DIR }} -type f -name "*.aar" -o -name "*.a" | while read file; do
            echo "  $(basename $file) - $(du -h $file | cut -f1)"
          done
          
      - name: 创建版本信息文件
        run: |
          cat > ${{ env.OUTPUT_DIR }}/version_info.txt << 'EOF'
          WebRTC Android 编译信息
          ========================
          编译时间: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          WebRTC 分支: ${{ env.WEBRTC_BRANCH }}
          GitHub Actions Run: ${{ github.run_number }}
          Commit: ${{ github.sha }}
          包含功能:
          - 回声消除 (AEC)
          - 降噪 (NS)
          - 语音活动检测 (VAD)
          已移除功能:
          - 视频编解码器 (VP8, VP9, H.264, AV1)
          - P2P 网络功能 (PeerConnection, DataChannel, SCTP)
          支持架构:
          - arm64-v8a
          - x86_64
          EOF
      - name: 生成安装文档
        run: |
          echo "生成 Android 安装文档..."
          
          # 复制文档模板
          cp docs/ANDROID_INSTALL_GUIDE.md ${{ env.OUTPUT_DIR }}/ANDROID_INSTALL_GUIDE.md
          
          # 替换模板变量
          sed -i "s/{{WEBRTC_BRANCH}}/${{ env.WEBRTC_BRANCH }}/g" ${{ env.OUTPUT_DIR }}/ANDROID_INSTALL_GUIDE.md
          sed -i "s/{{BUILD_TIME}}/$(date -u +"%Y-%m-%d %H:%M:%S UTC")/g" ${{ env.OUTPUT_DIR }}/ANDROID_INSTALL_GUIDE.md
          sed -i "s/{{RUN_NUMBER}}/${{ github.run_number }}/g" ${{ env.OUTPUT_DIR }}/ANDROID_INSTALL_GUIDE.md
          sed -i "s/{{COMMIT_SHA}}/${{ github.sha }}/g" ${{ env.OUTPUT_DIR }}/ANDROID_INSTALL_GUIDE.md
          
          echo "安装文档已生成"
          
      - name: 生成 JavaDoc
        run: |
          echo "生成 Java API 文档..."
          
          # 创建 JavaDoc 输出目录
          JAVADOC_DIR="${{ env.OUTPUT_DIR }}/javadoc"
          mkdir -p $JAVADOC_DIR
          
          # 查找 Java 源文件
          JAVA_SRC_DIR="${{ env.WEBRTC_SRC_DIR }}/src/sdk/android/src/java"
          
          if [ -d "$JAVA_SRC_DIR" ]; then
            echo "找到 Java 源代码目录: $JAVA_SRC_DIR"
            
            # 收集所有 Java 源文件
            JAVA_FILES=$(find $JAVA_SRC_DIR -name "*.java" | grep -E "(AudioProcessing|EchoCancellation|NoiseSuppression|VoiceDetection)" | head -100)
            
            if [ -n "$JAVA_FILES" ]; then
              echo "找到 $(echo "$JAVA_FILES" | wc -l) 个 Java 文件"
              
              # 生成 JavaDoc
              javadoc -d $JAVADOC_DIR \
                -encoding UTF-8 \
                -charset UTF-8 \
                -docencoding UTF-8 \
                -public \
                -use \
                -version \
                -author \
                -windowtitle "WebRTC Android Audio API" \
                -doctitle "WebRTC Android Audio API Documentation" \
                -header "WebRTC Android ${{ env.WEBRTC_BRANCH }}" \
                -footer "Generated by GitHub Actions" \
                -bottom "Copyright © $(date +%Y) WebRTC Project" \
                -link https://developer.android.com/reference \
                $JAVA_FILES 2>&1 || echo "JavaDoc 生成完成（可能有警告）"
              
              # 创建 JavaDoc 索引文件
              echo "JavaDoc 生成完成"
              ls -la $JAVADOC_DIR | head -20
              
              # 打包 JavaDoc
              cd $JAVADOC_DIR
              zip -q -r "${{ env.OUTPUT_DIR }}/javadoc.zip" *
              cd -
              
              echo "JavaDoc 已打包到: ${{ env.OUTPUT_DIR }}/javadoc.zip"
            else
              echo "未找到相关的 Java 源文件"
              echo "JavaDoc 跳过"
            fi
          else
            echo "Java 源代码目录不存在: $JAVA_SRC_DIR"
            echo "JavaDoc 跳过"
          fi
          
      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-android-${{ env.WEBRTC_BRANCH }}-${{ github.run_number }}
          path: ${{ env.OUTPUT_DIR }}/
          retention-days: 90
          
      - name: 创建 Release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: webrtc-android-${{ env.WEBRTC_BRANCH }}-${{ github.run_number }}
          name: WebRTC Android ${{ env.WEBRTC_BRANCH }} - Build ${{ github.run_number }}
          body: |
            WebRTC Android 编译产物
            
            ## 编译信息
            - WebRTC 分支: ${{ env.WEBRTC_BRANCH }}
            - Commit: ${{ github.sha }}
            - GitHub Actions Run: ${{ github.run_number }}
            
            ## 包含功能
            - 回声消除 (AEC)
            - 降噪 (NS)
            - 语音活动检测 (VAD)
            
            ## 已移除功能
            - 视频编解码器 (VP8, VP9, H.264, AV1)
            - P2P 网络功能 (PeerConnection, DataChannel, SCTP)
            
            ## 支持架构
            - arm64-v8a
            - x86_64
            
            ## 文件说明
            - `arm64/libwebrtc_arm64.aar` - ARM64 架构的 AAR 包
            - `x64/libwebrtc_x64.aar` - x86_64 架构的 AAR 包
            - `universal/libwebrtc_universal.aar` - 包含所有架构的通用 AAR 包
            - `arm64/libwebrtc_arm64.a` - ARM64 架构的静态库
            - `x64/libwebrtc_x64.a` - x86_64 架构的静态库
            - `ANDROID_INSTALL_GUIDE.md` - Android 安装和使用指南
            - `javadoc.zip` - Java API 文档（HTML 格式）
            - `version_info.txt` - 版本信息文件
            
            ## 快速开始
            1. 下载 `ANDROID_INSTALL_GUIDE.md` 查看详细的安装说明
            2. 下载 `javadoc.zip` 查看 Java API 文档
            3. 根据您的设备架构下载对应的 AAR 文件
            4. 按照 `ANDROID_INSTALL_GUIDE.md` 中的步骤集成到您的 Android 项目中
            
            ## Java API 文档
            本版本包含完整的 Java API 文档，解压 `javadoc.zip` 后在浏览器中打开 `index.html` 即可查看。
            主要包含以下 API 类：
            - `AudioProcessing` - 音频处理主类
            - `EchoCancellation` - 回声消除
            - `NoiseSuppression` - 降噪
            - `VoiceDetection` - 语音活动检测
            - `AudioDeviceModule` - 音频设备模块
          files: |
            ${{ env.OUTPUT_DIR }}/**/*.aar
            ${{ env.OUTPUT_DIR }}/**/*.a
            ${{ env.OUTPUT_DIR }}/ANDROID_INSTALL_GUIDE.md
            ${{ env.OUTPUT_DIR }}/javadoc.zip
            ${{ env.OUTPUT_DIR }}/version_info.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 安装 Maven
        run: |
          sudo apt-get install -y maven
          
      - name: 发布到 GitHub Packages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          echo "发布到 GitHub Packages..."
          
          # 定义版本号
          VERSION="${{ env.WEBRTC_BRANCH }}-${{ github.run_number }}"
          
          # 创建 Maven 临时目录
          MAVEN_TEMP_DIR="${{ runner.temp }}/maven-deploy"
          mkdir -p "$MAVEN_TEMP_DIR"
          
          # 为每个架构创建 Maven 项目并部署
          for ARCH in "arm64" "x64" "universal"; do
            echo "处理 $ARCH 架构..."
            
            # 创建 Maven 项目目录
            PROJECT_DIR="$MAVEN_TEMP_DIR/libwebrtc-$ARCH"
            mkdir -p "$PROJECT_DIR"
            
            # 创建 pom.xml
            cat > "$PROJECT_DIR/pom.xml" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0
                   http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.webrtc</groupId>
            <artifactId>libwebrtc-$ARCH</artifactId>
            <version>$VERSION</version>
            <packaging>aar</packaging>
            <name>WebRTC Android $ARCH</name>
            <description>WebRTC Android library with AEC, NS, and VAD support ($ARCH)</description>
            <url>https://github.com/${{ github.repository }}</url>
            <licenses>
              <license>
                <name>BSD 3-Clause</name>
                <url>https://chromium.googlesource.com/chromium/src/+/refs/heads/master/LICENSE</url>
              </license>
            </licenses>
            <scm>
              <url>https://github.com/${{ github.repository }}</url>
              <connection>scm:git:git://github.com/${{ github.repository }}.git</connection>
            </scm>
            <properties>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <distributionManagement>
              <repository>
                <id>github</id>
                <name>GitHub Packages</name>
                <url>https://maven.pkg.github.com/${{ github.repository }}</url>
              </repository>
            </distributionManagement>
          </project>
          EOF
            
            # 复制 AAR 文件
            mkdir -p "$PROJECT_DIR/target"
            if [ "$ARCH" == "arm64" ]; then
              cp "${{ env.OUTPUT_DIR }}/arm64/libwebrtc_arm64.aar" "$PROJECT_DIR/target/libwebrtc-$ARCH-$VERSION.aar"
            elif [ "$ARCH" == "x64" ]; then
              cp "${{ env.OUTPUT_DIR }}/x64/libwebrtc_x64.aar" "$PROJECT_DIR/target/libwebrtc-$ARCH-$VERSION.aar"
            else
              cp "${{ env.OUTPUT_DIR }}/universal/libwebrtc_universal.aar" "$PROJECT_DIR/target/libwebrtc-$ARCH-$VERSION.aar"
            fi
            
            # 创建 settings.xml
            cat > "$MAVEN_TEMP_DIR/settings.xml" << EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
            xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
            http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>\${env.GITHUB_ACTOR}</username>
                <password>\${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
            
            # 部署到 GitHub Packages
            cd "$PROJECT_DIR"
            mvn deploy -s "$MAVEN_TEMP_DIR/settings.xml" -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }} || echo "部署 $ARCH 失败，继续..."
          done
          
          echo "GitHub Packages 发布完成"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 编译完成
        run: |
          echo "========================================="
          echo "WebRTC Android 编译完成！"
          echo "========================================="
          echo "WebRTC 分支: ${{ env.WEBRTC_BRANCH }}"
          echo "输出目录: ${{ env.OUTPUT_DIR }}"
          echo "========================================="
